name: Release
# A release is built only from its tag v<VERSION> (app/tools/android/RELEASE.md): the push of the tag builds the
# APK unsigned, signs it with the release key in a separate job and publishes the GitHub release of that tag. A
# manual run rehearses a tag that does not exist yet (rehearse_tag): the same build, signing and checks, nothing
# published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      rehearse_tag:
        description: 'Dry run of a release tag not created yet (v<VERSION>): build and check everything, publish nothing'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  # Everything that fetches, compiles and packages code, the pinned third-party sources included. It has no
  # environment and no secret: the APK leaves it unsigned.
  build:
    name: Build
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      STORM_ANDROID_BUILD_TYPE: release
      STORM_NATIVE_BUILD_TYPE: Release
      # A release takes its versionName and versionCode from the tag (build_debug.sh runs release_version.py check).
      STORM_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.rehearse_tag }}
      STORM_RELEASE_REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      # The runner's 4 cores. Its free disk does not hold the engine's objects next to a full compiler cache:
      # the cache of this one-off build stays small.
      STORM_BUILD_JOBS: '4'
      CCACHE_MAXSIZE: 2G
      # The native build and its compiler cache on the runner's second disk (/mnt).
      STORM_CI_WORK: /mnt/storm-android-ci
      CCACHE_DIR: /mnt/ccache-storm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # A cold Release (LTO) engine build needs more space than the runner image leaves free: drop the
      # preinstalled toolchains this job never uses (its SDK and NDK are fetched under the work tree).
      - name: Free runner disk space
        run: |
          df -h / /mnt
          sudo mkdir -p /mnt/storm-android-ci /mnt/ccache-storm
          sudo chown "$(id -u):$(id -g)" /mnt/storm-android-ci /mnt/ccache-storm
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/julia*
          df -h / /mnt
      - name: Validate the trigger and the release version
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "$TRIGGER_EVENT" == push && "$REF_TYPE" != tag ]]; then
            echo '::error::Releases are built only from a tag push'
            exit 2
          fi
          if [[ -z "$STORM_RELEASE_TAG" ]]; then
            echo '::error::A manual run needs rehearse_tag=v<VERSION>'
            exit 2
          fi
          rehearse=()
          if [[ "$STORM_RELEASE_REHEARSAL" == 1 ]]; then
            rehearse=(--rehearse)
          fi
          python3 app/tools/android/release_version.py check --tag "$STORM_RELEASE_TAG" "${rehearse[@]}"
          # The released commit must be on main: the source a release links to stays reachable there.
          # release_version.py has checked that the tree is clean and, for a tag push, that the tag names
          # this commit.
          git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null || {
            echo '::error::The checkout has no origin/main to check the released commit against'
            exit 2
          }
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo '::error::The released commit is not on main'
            exit 2
          }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare build tools
        run: |
          sudo apt-get update
          # ccache: the compiler cache of the host checks and the native build.
          # libx11-dev, libgl-dev: the engine's host shaderc (renderer_bgfx/host-tools) configures bgfx,
          # which requires X11 and OpenGL on Linux.
          sudo apt-get install -y --no-install-recommends ffmpeg python3-venv perl make \
            ccache ninja-build libx11-dev libgl-dev
      - name: Run application host checks
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          python3 app/tools/android/run_host_tests.py
      - name: Build the unsigned ARM64 release APK
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          # Free disk and memory every five minutes: a runner that runs out of either is lost without a log.
          (while sleep 300; do echo "resources: $(df -h --output=avail / /mnt | tail -2 | xargs) avail; $(free -m | awk 'NR==2{print $7" MB memory available"}')"; done) &
          bash app/tools/android/build_debug.sh
      - name: Report the runner's free disk space
        if: always()
        run: df -h / /mnt
      - name: Hand the unsigned APK to the signing job
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-unsigned
          path: app/build/dist/
          if-no-files-found: error
          retention-days: 14
      # Unstripped native libraries for crash symbolication (matched by build ID).
      # Kept as a CI artifact only; the publication job never reads it.
      - name: Retain the native debug symbols
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-native-debug-symbols
          path: app/build/apk/native-debug-symbols.zip
          if-no-files-found: error
          retention-days: 90

  # The only job with the release key (the secrets of the `release` environment). It builds nothing: it takes the
  # build job's unsigned APK, the released commit's own scripts and the SDK build tools the build pins by SHA-256
  # (prepare_sdk.sh), with the runner image's Python and JDK. The key is in the environment and on disk during the
  # one signing step only, after everything the job fetches is in place.
  sign:
    name: Sign
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The signing secrets belong to this environment: restrict it to v* tags and main in the repository settings.
    environment: release
    env:
      STORM_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.rehearse_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download the unsigned APK of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-release-unsigned
          path: app/build/unsigned
      - name: Prepare the pinned build tools
        run: bash app/tools/android/prepare_sdk.sh "$RUNNER_TEMP/sdk"
      # sign_release.py writes the key to a 0600 file under RUNNER_TEMP for its apksigner call and removes it;
      # apksigner reads the passwords from this step's environment. Missing secrets fail the run: there is no
      # other key to fall back to.
      - name: Sign the release APK and check its signer
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          REHEARSE: ${{ github.event_name == 'workflow_dispatch' && '--rehearse' || '' }}
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          # REHEARSE is empty or one option: unquoted on purpose.
          # shellcheck disable=SC2086
          python3 app/tools/android/sign_release.py --tag "$STORM_RELEASE_TAG" $REHEARSE --commit "$GITHUB_SHA" \
            --unsigned app/build/unsigned --build-tools "$RUNNER_TEMP/sdk/tools/buildtools-36/android-16" \
            --keystore "$RUNNER_TEMP/release-signing.keystore" --out app/build/dist
      - name: Remove the release signing key
        if: always()
        run: rm -f "$RUNNER_TEMP/release-signing.keystore"
      - name: Retain the release APK
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-apk
          path: app/build/dist/
          if-no-files-found: error
          retention-days: 14

  # The GitHub release of the tag from the APK the signing job made. A rehearsal runs every check and stages the
  # release (android-release-draft) without publishing. Only this job can write to the repository, and it runs
  # no build.
  publish:
    name: Check and publish
    needs: sign
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      STORM_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.rehearse_tag }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Download the release APK of this run
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: android-release-apk
          path: app/build/release-artifact
      - name: Check and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          # The build's own pinned build tools (prepare_sdk.sh, sha256-checked), not the runner image's: platform and
          # build tools only (apksigner), no command-line tools (Lint runs where the Java is compiled).
          bash app/tools/android/prepare_sdk.sh "$RUNNER_TEMP/sdk"
          apksigner="$RUNNER_TEMP/sdk/tools/buildtools-36/android-16/apksigner"
          # DRY_RUN is empty or one option: unquoted on purpose.
          # shellcheck disable=SC2086
          python3 app/tools/android/publish_release.py --tag "$STORM_RELEASE_TAG" --artifact app/build/release-artifact \
            --commit "$GITHUB_SHA" --apksigner "$apksigner" --out app/build/release --repository "$GITHUB_REPOSITORY" $DRY_RUN
          cat app/build/release/RELEASE-NOTES.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the staged release of a rehearsal
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: android-release-draft
          path: app/build/release/
          if-no-files-found: error
          retention-days: 14
