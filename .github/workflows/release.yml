name: Release
# A release is built only from its tag v<VERSION> (app/tools/android/RELEASE.md): the push of the tag builds both
# flavors, signs them with the release key and publishes the GitHub release of that tag. A manual run rehearses a
# tag that does not exist yet (rehearse_tag): the same build and checks, nothing published.
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      rehearse_tag:
        description: 'Dry run of a release tag not created yet (v<VERSION>): build and check everything, publish nothing'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false
jobs:
  build:
    name: Build and sign
    runs-on: ubuntu-22.04
    timeout-minutes: 150
    # The signing secrets belong to this environment: restrict it to v* tags and main in the repository settings.
    environment: release
    env:
      STORM_ANDROID_BUILD_TYPE: release
      STORM_NATIVE_BUILD_TYPE: Release
      # A release takes its versionName and versionCode from the tag (build_debug.sh runs release_version.py check).
      STORM_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.rehearse_tag }}
      STORM_RELEASE_REHEARSAL: ${{ github.event_name == 'workflow_dispatch' && '1' || '0' }}
      STORM_ALLOW_COLD_BUILD: CI runner, the compiler cache is not kept between release runs
      # The runner's 4 cores. Its free disk does not hold the engine's objects next to a full compiler cache:
      # the cache of this one-off build stays small.
      STORM_BUILD_JOBS: '4'
      CCACHE_MAXSIZE: 2G
      # The native build and its compiler cache on the runner's second disk (/mnt).
      STORM_CI_WORK: /mnt/storm-android-ci
      CCACHE_DIR: /mnt/ccache-storm
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      # A cold Release (LTO) engine build needs more space than the runner image leaves free: drop the
      # preinstalled toolchains this job never uses (its SDK and NDK are fetched under the work tree).
      - name: Free runner disk space
        run: |
          df -h / /mnt
          sudo mkdir -p /mnt/storm-android-ci /mnt/ccache-storm
          sudo chown "$(id -u):$(id -g)" /mnt/storm-android-ci /mnt/ccache-storm
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /usr/share/swift \
            /usr/local/share/boost /opt/hostedtoolcache/CodeQL /usr/local/share/powershell /usr/local/julia*
          df -h / /mnt
      - name: Validate the trigger and the release version
        env:
          TRIGGER_EVENT: ${{ github.event_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          set -euo pipefail
          if [[ "$TRIGGER_EVENT" == push && "$REF_TYPE" != tag ]]; then
            echo '::error::Releases are built only from a tag push'
            exit 2
          fi
          if [[ -z "$STORM_RELEASE_TAG" ]]; then
            echo '::error::A manual run needs rehearse_tag=v<VERSION>'
            exit 2
          fi
          rehearse=()
          if [[ "$STORM_RELEASE_REHEARSAL" == 1 ]]; then
            rehearse=(--rehearse)
          fi
          python3 app/tools/android/release_version.py check --tag "$STORM_RELEASE_TAG" "${rehearse[@]}"
          # The released commit must be on main: the source a release links to stays reachable there.
          # release_version.py has checked that the tree is clean and, for a tag push, that the tag names
          # this commit.
          git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null || {
            echo '::error::The checkout has no origin/main to check the released commit against'
            exit 2
          }
          git merge-base --is-ancestor HEAD refs/remotes/origin/main || {
            echo '::error::The released commit is not on main'
            exit 2
          }
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Prepare build tools
        run: |
          sudo apt-get update
          # ccache: the engine compiles only through its ccache launcher (host checks, native build).
          # libx11-dev, libgl-dev: the engine's host shaderc (renderer_bgfx/host-tools) configures bgfx,
          # which requires X11 and OpenGL on Linux.
          sudo apt-get install -y --no-install-recommends ffmpeg clang-14 libclang-common-14-dev python3-venv perl make \
            ccache ninja-build libx11-dev libgl-dev
      - name: Run application host checks
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          python3 app/tools/android/run_host_tests.py
      - name: Verify native dialogue, inventory and render state
        env:
          CXX: clang++-14
        # The engine's host runner fetches the pinned GLM/SDL/fmt sources these checks compile against.
        run: |
          python3 engine/tools/ci/run_host_tests.py --work "$RUNNER_TEMP/engine-host" \
            --only android_dialogue_input mobile_inventory render_buffer_state
      # The release key exists only as a 0600 file under RUNNER_TEMP for the packaging step and is removed
      # afterwards. Missing secrets fail the run; there is no other key to fall back to.
      - name: Install the release signing key
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          missing=()
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEY_ALIAS ANDROID_STORE_PASSWORD ANDROID_KEY_PASSWORD; do
            [[ -n "${!name}" ]] || missing+=("$name")
          done
          if (( ${#missing[@]} )); then
            echo "::error::Missing release signing secrets: ${missing[*]}"
            exit 1
          fi
          keystore="$RUNNER_TEMP/release-signing.keystore"
          (umask 077; printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore")
          chmod 600 "$keystore"
          test -s "$keystore"
          echo "STORM_ANDROID_KEYSTORE=$keystore" >> "$GITHUB_ENV"
      - name: Build ARM64 release APKs (github and play flavors)
        env:
          STORM_ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          STORM_ANDROID_STORE_PASSWORD: ${{ secrets.ANDROID_STORE_PASSWORD }}
          STORM_ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          # Free disk and memory every five minutes: a runner that runs out of either is lost without a log.
          (while sleep 300; do echo "resources: $(df -h --output=avail / /mnt | tail -2 | xargs) avail; $(free -m | awk 'NR==2{print $7" MB memory available"}')"; done) &
          bash app/tools/android/build_debug.sh
      - name: Remove the release signing key
        if: always()
        run: |
          rm -f "$RUNNER_TEMP/release-signing.keystore"
          df -h / /mnt
      - name: Check the release key on the built APKs
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          python3 app/tools/android/release_signing.py --apksigner "$STORM_CI_WORK/tools/buildtools-36/android-16/apksigner" \
            app/build/dist/*.apk app/build/dist-play/*.apk
      - name: Retain the release APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-apk
          path: app/build/dist/
          if-no-files-found: error
          retention-days: 14
      # Google Play flavor (import through the system picker only, no download library), signed with the same
      # release key. It is never attached to a GitHub release.
      - name: Retain the Google Play flavor APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-play-apk
          path: app/build/dist-play/
          if-no-files-found: error
          retention-days: 14
      # Unstripped native libraries for crash symbolication (matched by build ID), one zip per flavor.
      # Kept as a CI artifact only; the publication job never reads it.
      - name: Retain the native debug symbols
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-native-debug-symbols
          path: |
            app/build/apk/github/native-debug-symbols.zip
            app/build/apk/play/native-debug-symbols.zip
          if-no-files-found: error
          retention-days: 90
      - name: Record verification scope
        run: |
          if [[ "$STORM_RELEASE_REHEARSAL" == 1 ]]; then
            outcome='rehearsal, nothing is published'
          else
            outcome='published by the publish job'
          fi
          {
            echo "Release $STORM_RELEASE_TAG ($outcome): ARM64 release APKs (github: android-release-apk, play: android-play-apk) built from the Release (LTO) engine and signed with the release key; native symbols in android-native-debug-symbols."
            echo 'No emulator is run in CI. This build does not establish installation or gameplay on a device.'
          } >> "$GITHUB_STEP_SUMMARY"

  # The GitHub release of the tag from the APK the build job made. A rehearsal runs every check and stages the
  # release (android-release-draft) without publishing. Only this job can write to the repository, and it runs
  # no build.
  publish:
    name: Check and publish
    needs: build
    runs-on: ubuntu-22.04
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      STORM_RELEASE_TAG: ${{ github.event_name == 'push' && github.ref_name || inputs.rehearse_tag }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
      - name: Download the release APK of this run
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: android-release-apk
          path: app/build/release-artifact
      - name: Check and publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && '--dry-run' || '' }}
        run: |
          set -euo pipefail
          export JAVA_HOME="$JAVA_HOME_17_X64"
          export PATH="$JAVA_HOME/bin:$PATH"
          # The build's own pinned build tools (prepare_sdk.sh, sha256-checked), not the runner image's.
          bash app/tools/android/prepare_sdk.sh "$RUNNER_TEMP/sdk"
          apksigner="$RUNNER_TEMP/sdk/tools/buildtools-36/android-16/apksigner"
          # DRY_RUN is empty or one option: unquoted on purpose.
          # shellcheck disable=SC2086
          python3 app/tools/android/publish_release.py --tag "$STORM_RELEASE_TAG" --artifact app/build/release-artifact \
            --commit "$GITHUB_SHA" --apksigner "$apksigner" --out app/build/release --repository "$GITHUB_REPOSITORY" $DRY_RUN
          cat app/build/release/RELEASE-NOTES.md >> "$GITHUB_STEP_SUMMARY"
      - name: Retain the staged release of a rehearsal
        if: ${{ github.event_name == 'workflow_dispatch' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-release-draft
          path: app/build/release/
          if-no-files-found: error
          retention-days: 14
